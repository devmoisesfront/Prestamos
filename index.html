<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mis Préstamos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<!-- SweetAlert -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- jsPDF -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.29/dist/jspdf.plugin.autotable.min.js"></script>

<!-- Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- PNG -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
body{
  font-family:'Inter',sans-serif;
  background:linear-gradient(135deg,#0d6efd,#062b6f);
  min-height:100vh;
}
.card{border-radius:20px;}
.option-card{
  cursor:pointer;
  transition:.25s;
}
.option-card:hover{
  transform:translateY(-6px);
  box-shadow:0 12px 25px rgba(0,0,0,.2);
}
tfoot td{
  font-weight:700;
  background:#f8f9fa;
}
.botones-flotantes button{
  margin:8px;
  box-shadow:0 8px 18px rgba(0,0,0,.25);
}
</style>
</head>

<body>
<div class="container py-4">
<div class="row justify-content-center">
<div class="col-lg-11">

<div class="card shadow-lg p-4" id="prestamoCard">
<h3 class="text-center mb-3">
<i class="bi bi-cash-coin"></i> Mis Préstamos
</h3>

<label>Monto a prestar</label>
<input type="text" id="monto" class="form-control mb-3">

<label>Tasa de interés mensual (%)</label>
<input type="number" id="tasaInput" class="form-control mb-3" placeholder="Ej: 10">

<label>Frecuencia de pago</label>
<select id="frecuencia" class="form-select mb-4">
  <option value="">Seleccione</option>
  <option value="diario">Diario</option>
  <option value="semanal">Semanal</option>
  <option value="quincenal">Quincenal</option>
  <option value="mensual">Mensual</option>
</select>

<div id="opciones" class="row g-4 d-none"></div>

<div id="tablaWrap" class="d-none mt-4">
<table class="table table-bordered text-center align-middle">
<thead class="table-light">
<tr>
<th>Cuota</th>
<th>Fecha de pago</th>
<th>Capital</th>
<th>Interés</th>
<th>Total</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
<tfoot>
<tr>
<td colspan="2">TOTALES</td>
<td id="totalCapital"></td>
<td id="totalInteres"></td>
<td id="totalGeneral"></td>
</tr>
</tfoot>
</table>

<div class="botones-flotantes text-center mt-4">
<button class="btn btn-success" onclick="exportPDF()">PDF</button>
<button class="btn btn-primary" onclick="exportExcel()">Excel</button>
<button class="btn btn-warning" onclick="exportPNG()">PNG</button>
<button class="btn btn-dark" onclick="nuevoCliente()">Nuevo cliente</button>
</div>
</div>

</div>
</div>
</div>
</div>

<script>
let montoReal=0, tasaMensual=0;
const cuotas=[6,8,10,12,16,20,24,30];
const diasFrecuencia={
  diario:1,
  semanal:7,
  quincenal:15,
  mensual:30
};

const formato=v=>v.toLocaleString('es-CO',{style:'currency',currency:'COP',minimumFractionDigits:0});
const formatoFecha=f=>f.toLocaleDateString('es-CO');

monto.addEventListener("input",e=>{
  montoReal=parseInt(e.target.value.replace(/\D/g,''))||0;
  e.target.value=montoReal.toLocaleString("es-CO");
});

tasaInput.addEventListener("input",mostrarOpciones);
frecuencia.addEventListener("change",mostrarOpciones);

function mostrarOpciones(){
  tasaMensual=(parseFloat(tasaInput.value)||0)/100;
  if(!montoReal || !tasaMensual || !frecuencia.value) return;

  opciones.innerHTML="";
  cuotas.forEach(c=>{
    opciones.innerHTML+=`
    <div class="col-md-3">
      <div class="card option-card p-3 text-center" onclick="generarTabla(${c})">
        <strong>${c} cuotas</strong><br>${frecuencia.value}
      </div>
    </div>`;
  });
  opciones.classList.remove("d-none");
}

function generarTabla(n){
  const meses=(n*diasFrecuencia[frecuencia.value])/30;
  const interesTotal=montoReal*tasaMensual*meses;
  const totalPagar=montoReal+interesTotal;

  const capCuota=montoReal/n;
  const intCuota=interesTotal/n;
  const totCuota=totalPagar/n;

  tabla.innerHTML="";
  let fecha=new Date();

  for(let i=1;i<=n;i++){
    fecha = sumarDias(fecha, diasFrecuencia[frecuencia.value]);
    tabla.innerHTML+=`
    <tr>
      <td>${i}/${n}</td>
      <td>${formatoFecha(fecha)}</td>
      <td>${formato(capCuota)}</td>
      <td>${formato(intCuota)}</td>
      <td>${formato(totCuota)}</td>
    </tr>`;
  }

  totalCapital.innerText=formato(montoReal);
  totalInteres.innerText=formato(interesTotal);
  totalGeneral.innerText=formato(totalPagar);

  tablaWrap.classList.remove("d-none");
}

// Función para sumar días según la frecuencia
function sumarDias(fecha, dias){
  const nueva = new Date(fecha);
  nueva.setDate(nueva.getDate() + dias);
  return nueva;
}

function nuevoCliente(){
  location.reload();
}

function exportPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  doc.text("Proyección de Préstamo",14,15);
  doc.autoTable({html:"table",startY:20});
  doc.save("prestamo.pdf");
}

function exportExcel(){
  const wb=XLSX.utils.table_to_book(document.querySelector("table"));
  XLSX.writeFile(wb,"prestamo.xlsx");
}

function exportPNG(){
  html2canvas(prestamoCard).then(canvas=>{
    const a=document.createElement("a");
    a.href=canvas.toDataURL();
    a.download="prestamo.png";
    a.click();
  });
}
</script>
</body>
</html>
